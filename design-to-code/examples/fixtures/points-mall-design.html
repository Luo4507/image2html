<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>积分商城</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f5f5;
      color: #333;
    }
    .header {
      background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
      color: white;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-title { font-size: 18px; font-weight: 600; }
    .header-icons { display: flex; gap: 16px; }
    .header-icons span { font-size: 20px; }
    .points-banner {
      background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
      color: white;
      padding: 24px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .points-info .label { font-size: 14px; opacity: 0.9; }
    .points-info .value { font-size: 36px; font-weight: 700; margin-top: 4px; }
    .points-info .unit { font-size: 14px; font-weight: 400; }
    .sign-btn {
      background: white;
      color: #ff6b35;
      border: none;
      padding: 10px 24px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .nav-tabs {
      background: white;
      display: flex;
      padding: 0 20px;
      border-bottom: 1px solid #eee;
    }
    .nav-tab {
      padding: 16px 0;
      margin-right: 32px;
      font-size: 15px;
      color: #666;
      cursor: pointer;
      position: relative;
    }
    .nav-tab.active {
      color: #ff6b35;
      font-weight: 600;
    }
    .nav-tab.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 24px;
      height: 3px;
      background: #ff6b35;
      border-radius: 2px;
    }
    .goods-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 16px 20px;
    }
    .goods-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .goods-img {
      width: 100%;
      height: 160px;
      background: linear-gradient(45deg, #f0f0f0, #e0e0e0);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      color: #ccc;
    }
    .goods-info {
      padding: 12px;
    }
    .goods-title {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .goods-price {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .price-points {
      color: #ff6b35;
      font-size: 18px;
      font-weight: 700;
    }
    .price-points .unit {
      font-size: 12px;
      font-weight: 400;
    }
    .exchange-btn {
      background: #ff6b35;
      color: white;
      border: none;
      padding: 6px 16px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }
    .goods-stock {
      font-size: 12px;
      color: #999;
      margin-top: 4px;
    }
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      display: flex;
      justify-content: space-around;
      padding: 8px 0;
      border-top: 1px solid #eee;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #999;
      font-size: 12px;
    }
    .nav-item.active {
      color: #ff6b35;
    }
    .nav-icon {
      font-size: 24px;
    }
    .section-title {
      padding: 16px 20px 8px;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title::before {
      content: '';
      width: 4px;
      height: 16px;
      background: #ff6b35;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <!-- 顶部导航 -->
  <div class="header">
    <span class="header-title">积分商城</span>
    <div class="header-icons">
      <span>🔍</span>
      <span>📋</span>
    </div>
  </div>

  <!-- 积分信息 -->
  <div class="points-banner">
    <div class="points-info">
      <div class="label">我的积分</div>
      <div class="value">2,580 <span class="unit">分</span></div>
    </div>
    <button class="sign-btn">签到赚积分</button>
  </div>

  <!-- 分类标签 -->
  <div class="nav-tabs">
    <div class="nav-tab active">精选</div>
    <div class="nav-tab">数码家电</div>
    <div class="nav-tab">生活用品</div>
    <div class="nav-tab">美食券</div>
  </div>

  <!-- 热门兑换 -->
  <div class="section-title">🔥 热门兑换</div>
  <div class="goods-grid">
    <div class="goods-card">
      <div class="goods-img">🎧</div>
      <div class="goods-info">
        <div class="goods-title">无线蓝牙耳机 降噪运动耳机</div>
        <div class="goods-price">
          <span class="price-points">1,280 <span class="unit">积分</span></span>
          <button class="exchange-btn">兑换</button>
        </div>
        <div class="goods-stock">剩余 23 件</div>
      </div>
    </div>
    <div class="goods-card">
      <div class="goods-img">⌚</div>
      <div class="goods-info">
        <div class="goods-title">智能手表 心率监测 运动手环</div>
        <div class="goods-price">
          <span class="price-points">2,500 <span class="unit">积分</span></span>
          <button class="exchange-btn">兑换</button>
        </div>
        <div class="goods-stock">剩余 8 件</div>
      </div>
    </div>
    <div class="goods-card">
      <div class="goods-img">🎒</div>
      <div class="goods-info">
        <div class="goods-title">时尚双肩包 大容量旅行背包</div>
        <div class="goods-price">
          <span class="price-points">680 <span class="unit">积分</span></span>
          <button class="exchange-btn">兑换</button>
        </div>
        <div class="goods-stock">剩余 45 件</div>
      </div>
    </div>
    <div class="goods-card">
      <div class="goods-img">☕</div>
      <div class="goods-info">
        <div class="goods-title">星巴克咖啡券 中杯通用券</div>
        <div class="goods-price">
          <span class="price-points">300 <span class="unit">积分</span></span>
          <button class="exchange-btn">兑换</button>
        </div>
        <div class="goods-stock">剩余 156 件</div>
      </div>
    </div>
  </div>

  <!-- 精品推荐 -->
  <div class="section-title">💎 精品推荐</div>
  <div class="goods-grid">
    <div class="goods-card">
      <div class="goods-img">📱</div>
      <div class="goods-info">
        <div class="goods-title">手机支架 桌面懒人支架</div>
        <div class="goods-price">
          <span class="price-points">150 <span class="unit">积分</span></span>
          <button class="exchange-btn">兑换</button>
        </div>
        <div class="goods-stock">剩余 89 件</div>
      </div>
    </div>
    <div class="goods-card">
      <div class="goods-img">🔌</div>
      <div class="goods-info">
        <div class="goods-title">快充数据线 Type-C 充电线</div>
        <div class="goods-price">
          <span class="price-points">200 <span class="unit">积分</span></span>
          <button class="exchange-btn">兑换</button>
        </div>
        <div class="goods-stock">剩余 67 件</div>
      </div>
    </div>
  </div>

  <!-- 底部导航 -->
  <div class="bottom-nav">
    <div class="nav-item active">
      <span class="nav-icon">🏠</span>
      <span>首页</span>
    </div>
    <div class="nav-item">
      <span class="nav-icon">📋</span>
      <span>订单</span>
    </div>
    <div class="nav-item">
      <span class="nav-icon">🎁</span>
      <span>福利</span>
    </div>
    <div class="nav-item">
      <span class="nav-icon">👤</span>
      <span>我的</span>
    </div>
  </div>
</body>
</html>
