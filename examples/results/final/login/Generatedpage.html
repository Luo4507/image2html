<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>欢迎登录</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #eef0f1;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
    color: #333;
    -webkit-font-smoothing: antialiased;
  }
  .page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .login-card {
    width: 400px;
    max-width: 100%;
    background: #f7f8f9;
    border-radius: 8px;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08), 0 2px 6px rgba(0, 0, 0, 0.05);
    padding: 34px 32px 28px;
  }
  .login-title {
    margin: 0 0 12px;
    font-size: 24px;
    line-height: 1.2;
    font-weight: 700;
    color: #1c1e21;
  }
  .login-subtitle {
    margin: 0 0 26px;
    font-size: 13px;
    color: #5f6368;
  }
  .form-item { margin-bottom: 22px; }
  .form-label {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
    color: #333;
  }
  .form-input {
    display: block;
    width: 100%;
    height: 38px;
    padding: 0 12px;
    font-size: 14px;
    color: #333;
    background: #fafbfc;
    border: 1px solid #d9dce0;
    border-radius: 4px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
  }
  .form-input::placeholder { color: #a6abb2; }
  .form-input:hover { border-color: #c0c4ca; }
  .form-input:focus {
    border-color: #1890ff;
    background: #ffffff;
    box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.15);
  }
  .login-btn {
    display: block;
    width: 100%;
    height: 38px;
    margin-top: 24px;
    background: #1890ff;
    border: none;
    border-radius: 4px;
    color: #ffffff;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.2s;
  }
  .login-btn:hover { background: #40a9ff; }
  .login-btn:active { background: #096dd9; }
  .login-btn:focus-visible {
    outline: 2px solid #096dd9;
    outline-offset: 2px;
  }
  @media (max-width: 480px) {
    .login-card { padding: 28px 20px 24px; }
  }
</style>
</head>
<body>
<main class="page">
  <section class="login-card" aria-labelledby="login-title">
    <h1 class="login-title" id="login-title">欢迎登录</h1>
    <p class="login-subtitle">企业级应用管理平台</p>
    <form id="login-form" novalidate>
      <div class="form-item">
        <label class="form-label" for="username">用户名</label>
        <input class="form-input" type="text" id="username" name="username" placeholder="请输入用户名" autocomplete="username">
      </div>
      <div class="form-item">
        <label class="form-label" for="password">密码</label>
        <input class="form-input" type="password" id="password" name="password" placeholder="请输入密码" autocomplete="current-password">
      </div>
      <button class="login-btn" type="submit">登 录</button>
    </form>
  </section>
</main>
<script>
  // @ts-check
  (function () {
    /** @type {HTMLFormElement | null} */
    var form = document.getElementById('login-form');
    if (form) {
      form.addEventListener('submit', function (/** @type {Event} */ e) {
        e.preventDefault();
      });
    }
  })();
</script>
</body>
</html>
