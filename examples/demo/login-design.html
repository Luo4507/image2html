<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录页设计稿</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f5f5f5;
      color: #262626;
      font-family: "Microsoft YaHei", Arial, sans-serif;
    }
    .login-card {
      width: 400px;
      padding: 32px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }
    h1 { margin: 0 0 8px; font-size: 24px; font-weight: 600; }
    .subtitle { margin: 0 0 24px; color: #595959; font-size: 14px; }
    label { display: block; margin: 16px 0 8px; font-size: 14px; }
    input {
      width: 100%;
      height: 40px;
      padding: 8px 12px;
      border: 1px solid #d9d9d9;
      border-radius: 6px;
      font-size: 14px;
    }
    button {
      width: 100%;
      height: 40px;
      margin-top: 24px;
      border: 0;
      border-radius: 6px;
      background: #1890ff;
      color: #ffffff;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="login-card">
    <h1>欢迎登录</h1>
    <p class="subtitle">企业级应用管理平台</p>
    <form>
      <label for="username">用户名</label>
      <input id="username" placeholder="请输入用户名">
      <label for="password">密码</label>
      <input id="password" type="password" placeholder="请输入密码">
      <button type="submit">登 录</button>
    </form>
  </main>
</body>
</html>
